<!doctype html>
<html lang="%lang%" dir="%dir%" data-theme="theme" class="">
	<head>
		<meta charset="utf-8" />

		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon-96x96.png" sizes="96x96" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
		<link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-title" content="%apple_web_app_title%" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- Marks the document as scripted BEFORE first paint, so the scroll-reveal pre-state (opacity 0)
			 only ever applies when the observer that clears it will actually run. Without this the
			 no-JS render would keep every revealed section permanently invisible. -->
		<script>
			document.documentElement.classList.add('js');
		</script>

		<meta name="author" content="%meta_author%" />
		<!-- No global robots tag: index,follow is the default, and declaring it here put a second,
			 contradictory robots meta on the 404 page, which sets its own noindex. -->

		<meta property="og:site_name" content="%meta_site_name%" />
		<meta property="og:type" content="website" />
		<meta property="twitter:card" content="summary_large_image" />

		<!-- Absolute, not %sveltekit.assets%: social scrapers do not resolve relative image URLs, and
			 the card is declared summary_large_image, so without this every share renders blank. -->
		<meta property="og:image" content="https://texpile.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="The Texpile editor: LaTeX source, live PDF preview, and a comment thread" />
		<meta property="twitter:image" content="https://texpile.com/og-image.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
